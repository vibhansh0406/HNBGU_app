name: Publish CampusOne APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: CampusOne

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/campusone-release.jks"
          keytool -list -keystore "$HOME/.android/campusone-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_FILE=$HOME/.android/campusone-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Configure app secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
        run: |
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.anon.key=$SUPABASE_ANON_KEY"
            echo "google.oauth.client_id=$GOOGLE_OAUTH_CLIENT_ID"
            echo "google.oauth.web_client_id=$GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "google.oauth.web_client_secret=$GOOGLE_OAUTH_WEB_CLIENT_SECRET"
            echo "google.oauth.callback_url=$GOOGLE_OAUTH_CALLBACK_URL"
          } > local.properties
      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          gradle assembleRelease
      - name: Verify release APK and generate SHA-256
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(ls -t "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          AAPT=$(ls -t "$ANDROID_HOME"/build-tools/*/aapt | head -1)
          $APKSIGNER verify --verbose "$APK"
          PACKAGE=$($AAPT dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$PACKAGE" = "in.campusone.app"
          cp "$APK" "CampusOne-${GITHUB_REF_NAME}.apk"
          sha256sum "CampusOne-${GITHUB_REF_NAME}.apk" > "CampusOne-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CampusOne/CampusOne-${{ github.ref_name }}.apk
            CampusOne/CampusOne-${{ github.ref_name }}.apk.sha256
