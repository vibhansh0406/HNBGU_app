name: Build and Verify CampusOne Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [phase-3, fix/notice-audience-targeting]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: campusone-android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CampusOne

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Decode and validate permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/campusone-release.jks"
          test -s "$HOME/.android/campusone-release.jks"
          keytool -list -keystore "$HOME/.android/campusone-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "KEYSTORE_FILE=$HOME/.android/campusone-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure app build properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_WEB_CLIENT_ID GOOGLE_OAUTH_WEB_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          case "$GOOGLE_OAUTH_WEB_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::error::GOOGLE_OAUTH_WEB_CLIENT_ID is not a Google OAuth client ID"; exit 1 ;;
          esac
          if [ "$GOOGLE_OAUTH_CLIENT_ID" = "$GOOGLE_OAUTH_WEB_CLIENT_ID" ]; then
            echo "::error::Android and Web OAuth client IDs must be separate clients."
            exit 1
          fi
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.anon.key=$SUPABASE_ANON_KEY"
            echo "google.oauth.client_id=$GOOGLE_OAUTH_CLIENT_ID"
            echo "google.oauth.web_client_id=$GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "google.oauth.web_client_secret=$GOOGLE_OAUTH_WEB_CLIENT_SECRET"
            echo "google.oauth.callback_url=$GOOGLE_OAUTH_CALLBACK_URL"
          } > local.properties
          {
            echo "Build commit: $GITHUB_SHA"
            echo "Google Android OAuth Client ID: $GOOGLE_OAUTH_CLIENT_ID"
            echo "Google Web OAuth Client ID embedded in APK: $GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "Package: in.campusone.app"
            echo "Release signing SHA-1: 50341BDAAE1E1CFCC7E26893D3CF8A1F7AFC35A2"
          } > CampusOne-build-info.txt

      - name: Build release APK
        env:
          CURRENT_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$CURRENT_VERSION_CODE" \
          VERSION_NAME="1.0.$CURRENT_VERSION_CODE" gradle assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify release APK metadata, signatures and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$PACKAGE" = "in.campusone.app" || {
            echo "::error::Unexpected APK package: $PACKAGE"
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'35'"
          printf '%s\n' "$BADGING" | grep -Eq "^application:.*label='CampusOne'.*icon='"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::Release APK is marked debuggable."
            exit 1
          fi
          "$ZIPALIGN" -c 4 "$APK"

          SIGNATURE="$RUNNER_TEMP/campusone-release-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$SIGNATURE"
          for scheme in "v2 scheme (APK Signature Scheme v2)" "v3 scheme (APK Signature Scheme v3)"; do
            grep -Fq "Verified using $scheme: true" "$SIGNATURE" || {
              echo "::error::APK is missing required $scheme signature."
              exit 1
            }
          done

          EXPECTED_SHA1="50341BDAAE1E1CFCC7E26893D3CF8A1F7AFC35A2"
          EXPECTED_SHA256="E28B7893A26DF63884498AEF018575D3875ACEF2C0DC0DB9A06D4EFFA543F273"
          SHA1=$(grep -F "certificate SHA-1 digest:" "$SIGNATURE" | tail -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          SHA256=$(grep -F "certificate SHA-256 digest:" "$SIGNATURE" | tail -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$SHA1" = "$EXPECTED_SHA1" || {
            echo "::error::Permanent release SHA-1 mismatch."
            exit 1
          }
          test "$SHA256" = "$EXPECTED_SHA256" || {
            echo "::error::Permanent release SHA-256 mismatch."
            exit 1
          }

          test -s ci/debug.keystore
          DEBUG_SHA1=$(keytool -list -v -keystore ci/debug.keystore \
            -alias androiddebugkey -storepass android | grep -m1 'SHA1:' | awk -F'SHA1: ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$DEBUG_SHA1" || {
            echo "::error::Could not read the debug certificate fingerprint."
            exit 1
          }
          if grep -Fqi "$DEBUG_SHA1" "$SIGNATURE"; then
            echo "::error::Release APK is signed with the debug certificate."
            exit 1
          fi

          MANIFEST_DUMP="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          FORBIDDEN=(
            "android.permission.READ_SMS"
            "android.permission.RECEIVE_SMS"
            "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
            "android.permission.BIND_ACCESSIBILITY_SERVICE"
            "android.permission.REQUEST_INSTALL_PACKAGES"
            "android.permission.QUERY_ALL_PACKAGES"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for permission in "${FORBIDDEN[@]}"; do
            if printf '%s\n' "$MANIFEST_DUMP" | grep -Fq "$permission"; then
              echo "::error::Forbidden install-sensitive permission found: $permission"
              exit 1
            fi
          done

          echo "PASS: package=$PACKAGE; release-only signing; v2/v3 signatures; permanent release key; alignment; permission audit."

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusOne-release-apk
          path: |
            CampusOne/app/build/outputs/apk/release/app-release.apk
            CampusOne/CampusOne-build-info.txt
          if-no-files-found: error
          retention-days: 14
