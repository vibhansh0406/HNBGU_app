name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]
defaults:
  run:
    working-directory: CampusOne
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > app/google-services.json; fi
      - name: Build debug APK
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew && ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: campusone-debug-apk
          path: CampusOne/app/build/outputs/apk/debug/*.apk
