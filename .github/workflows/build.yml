name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]
defaults:
  run:
    working-directory: CampusOne
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode and validate permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the permanent release keystore secrets before building."
              exit 1
            fi
          done
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/campusone-release.jks"
          test -s "$HOME/.android/campusone-release.jks"
          keytool -list -keystore "$HOME/.android/campusone-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_FILE=$HOME/.android/campusone-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Signing report (SHA-1 of each build variant)
        run: gradle signingReport --console=plain
      - name: Write local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
        run: |
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.anon.key=$SUPABASE_ANON_KEY"
            echo "google.oauth.client_id=$GOOGLE_OAUTH_CLIENT_ID"
            echo "google.oauth.web_client_id=$GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "google.oauth.web_client_secret=$GOOGLE_OAUTH_WEB_CLIENT_SECRET"
            echo "google.oauth.callback_url=$GOOGLE_OAUTH_CALLBACK_URL"
          } > local.properties
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Verify both APKs, package, signatures, and alignment
        run: |
          APKSIGNER=$(ls -t $ANDROID_HOME/build-tools/*/apksigner | head -1)
          AAPT=$(ls -t $ANDROID_HOME/build-tools/*/aapt | head -1)
          ZIPALIGN=$(ls -t $ANDROID_HOME/build-tools/*/zipalign | head -1)
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          DEBUG_CERT=""
          RELEASE_CERT=""
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            echo "=== $apk ==="
            PACKAGE=$($AAPT dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
            test "$PACKAGE" = "in.campusone.app" || { echo "::error::Unexpected package: $PACKAGE"; exit 1; }
            $APKSIGNER verify --verbose "$apk"
            $ZIPALIGN -c 4 "$apk"
            CERT_INFO=$($APKSIGNER verify --print-certs "$apk")
            CERT=$(printf '%s\n' "$CERT_INFO" | sed -n "s/^Signer #1 certificate SHA-256 digest: //p")
            test -n "$CERT"
            if [ "$apk" = "$DEBUG_APK" ]; then
              DEBUG_CERT="$CERT"
            else
              RELEASE_CERT="$CERT"
              RELEASE_SHA1=$(printf '%s\n' "$CERT_INFO" | sed -n "s/^Signer #1 certificate SHA-1 digest: //p" | tr -d ':' | tr '[:lower:]' '[:upper:]')
              EXPECTED_RELEASE_SHA1="50341BDAAE1E1CFCC7E26893D3CF8A1F7AFC35A2"
              if [ "$RELEASE_SHA1" != "$EXPECTED_RELEASE_SHA1" ]; then
                echo "::error::Release SHA-1 mismatch. Expected $EXPECTED_RELEASE_SHA1, got $RELEASE_SHA1"
                exit 1
              fi
              echo "Verified permanent release SHA-1=$RELEASE_SHA1"
            fi
            echo "Verified package=$PACKAGE signer_sha256=$CERT"
          done
          if [ "$DEBUG_CERT" = "$RELEASE_CERT" ]; then
            echo "::error::Release APK is signed with the debug certificate. A separate permanent release keystore is required."
            exit 1
          fi
          echo "Debug and Release signatures are valid and use distinct certificates."
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: campusone-debug-apk
          path: CampusOne/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: campusone-release-apk
          path: CampusOne/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
