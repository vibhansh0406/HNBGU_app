name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add google-services.json
        working-directory: CampusOne
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Set the GOOGLE_SERVICES_JSON repository secret to the base64-encoded google-services.json."
            exit 1
          fi
          printf '%s' "$GSJ" | base64 --decode > app/google-services.json

      - name: Build debug APK
        working-directory: CampusOne
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: campusone-debug-apk
          path: CampusOne/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
