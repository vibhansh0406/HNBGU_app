name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]
defaults:
  run:
    working-directory: CampusOne
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: campusone-debug-apk
          path: CampusOne/app/build/outputs/apk/debug/*.apk
