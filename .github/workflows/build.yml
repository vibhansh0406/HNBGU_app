name: Verify CampusOne Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: CampusOne

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode and validate permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/campusone-release.jks"
          test -s "$HOME/.android/campusone-release.jks"
          keytool -list -keystore "$HOME/.android/campusone-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "KEYSTORE_FILE=$HOME/.android/campusone-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure app build properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
        run: |
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.anon.key=$SUPABASE_ANON_KEY"
            echo "google.oauth.client_id=$GOOGLE_OAUTH_CLIENT_ID"
            echo "google.oauth.web_client_id=$GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "google.oauth.web_client_secret=$GOOGLE_OAUTH_WEB_CLIENT_SECRET"
            echo "google.oauth.callback_url=$GOOGLE_OAUTH_CALLBACK_URL"
          } > local.properties

      - name: Build same-key upgrade baseline and current signed APK
        env:
          CURRENT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION_CODE=$((CURRENT_VERSION_CODE - 1))
          if [ "$PREVIOUS_VERSION_CODE" -lt 1 ]; then
            PREVIOUS_VERSION_CODE=1
          fi

          # Build a lower-version APK with the exact same source and permanent key.
          VERSION_CODE="$PREVIOUS_VERSION_CODE" \
          VERSION_NAME="1.0.$PREVIOUS_VERSION_CODE" gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-previous-release.apk

          # Force a fresh packaging pass so the current version metadata is embedded.
          VERSION_CODE="$CURRENT_VERSION_CODE" \
          VERSION_NAME="1.0.$CURRENT_VERSION_CODE" gradle assembleRelease --rerun-tasks

          test -s app/build/outputs/apk/release/app-previous-release.apk
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify release APK metadata, signing identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$PACKAGE" = "in.campusone.app" || {
            echo "::error::Unexpected APK package: $PACKAGE"
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'35'"
          printf '%s\n' "$BADGING" | grep -Eq "^application:.*label='CampusOne'.*icon='"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::Release APK is marked debuggable."
            exit 1
          fi

          "$ZIPALIGN" -c 4 "$APK"

          SIGNATURE="$RUNNER_TEMP/campusone-release-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$SIGNATURE"
          for scheme in "v2 scheme (APK Signature Scheme v2)" "v3 scheme (APK Signature Scheme v3)"; do
            grep -Fq "Verified using $scheme: true" "$SIGNATURE" || {
              echo "::error::APK is missing required $scheme signature."
              exit 1
            }
          done

          SHA1=$(grep -F "certificate SHA-1 digest:" "$SIGNATURE" | tail -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          SHA256=$(grep -F "certificate SHA-256 digest:" "$SIGNATURE" | tail -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1="50341BDAAE1E1CFCC7E26893D3CF8A1F7AFC35A2"
          EXPECTED_SHA256="E28B7893A26DF63884498AEF018575D3875ACEF2C0DC0DB9A06D4EFFA543F273"
          test "$SHA1" = "$EXPECTED_SHA1" || {
            echo "::error::Permanent release SHA-1 mismatch."
            exit 1
          }
          test "$SHA256" = "$EXPECTED_SHA256" || {
            echo "::error::Permanent release SHA-256 mismatch."
            exit 1
          }

          MANIFEST_DUMP="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          FORBIDDEN=(
            "android.permission.READ_SMS"
            "android.permission.RECEIVE_SMS"
            "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
            "android.permission.BIND_ACCESSIBILITY_SERVICE"
            "android.permission.REQUEST_INSTALL_PACKAGES"
            "android.permission.QUERY_ALL_PACKAGES"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for permission in "${FORBIDDEN[@]}"; do
            if printf '%s\n' "$MANIFEST_DUMP" | grep -Fq "$permission"; then
              echo "::error::Forbidden install-sensitive permission found: $permission"
              exit 1
            fi
          done

          echo "PASS: package=$PACKAGE; v2/v3 signatures; permanent certificate; zip alignment; install-sensitive permission audit."

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Test real Android 12 clean install, in-place upgrade and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          working-directory: CampusOne
          script: |
            set -euo pipefail
            PACKAGE="in.campusone.app"

            # Exercise the real v3 -> v4 -> v5 Room migration on the Android 12 emulator.
            gradle connectedDebugAndroidTest
            adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
            adb uninstall "$PACKAGE.test" >/dev/null 2>&1 || true
            PREVIOUS_APK="app/build/outputs/apk/release/app-previous-release.apk"
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

            test -s "$PREVIOUS_APK"
            test -s "$RELEASE_APK"
            adb wait-for-device

            # Install the lower version first, then update it without uninstalling.
            adb install "$PREVIOUS_APK"
            OLD_CODE=$(adb shell dumpsys package "$PACKAGE" | grep -m1 -o 'versionCode=[0-9]*' | cut -d= -f2 | tr -d '\r')
            test "$OLD_CODE" -lt "$GITHUB_RUN_NUMBER"

            adb install -r "$RELEASE_APK"
            NEW_CODE=$(adb shell dumpsys package "$PACKAGE" | grep -m1 -o 'versionCode=[0-9]*' | cut -d= -f2 | tr -d '\r')
            test "$NEW_CODE" = "$GITHUB_RUN_NUMBER"
            adb shell pm path "$PACKAGE"

            # Launch the updated app and ensure its process remains alive.
            adb logcat -c
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/.MainActivity"
            sleep 12
            APP_PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            if [ -z "$APP_PID" ]; then
              adb logcat -d -t 2000
              echo "::error::CampusOne process exited after launch."
              exit 1
            fi

            # Also verify a clean install of the exact release APK.
            adb uninstall "$PACKAGE"
            adb install "$RELEASE_APK"
            adb shell am start -W -n "$PACKAGE/.MainActivity"
            sleep 8
            APP_PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            if [ -z "$APP_PID" ]; then
              adb logcat -d -t 2000
              echo "::error::CampusOne failed after clean installation."
              exit 1
            fi
            echo "PASS: Android 12 installed the previous signed build, upgraded it in place, launched it, then clean-installed and launched the current APK."

      - name: Upload APK only after all install tests pass
        uses: actions/upload-artifact@v4
        with:
          name: CampusOne-release-apk
          path: CampusOne/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
