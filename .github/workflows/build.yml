name: Build and Verify CampusOne Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, phase-3, fix/notice-audience-targeting]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: campusone-android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CampusOne

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Decode and validate permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/campusone-release.jks"
          test -s "$HOME/.android/campusone-release.jks"
          keytool -list -keystore "$HOME/.android/campusone-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "KEYSTORE_FILE=$HOME/.android/campusone-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare stable legacy debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s ci/debug.keystore
          for d in "${ANDROID_USER_HOME:-}" "$HOME/.config/.android" "$HOME/.android"; do
            if [ -n "$d" ]; then
              mkdir -p "$d"
              cp ci/debug.keystore "$d/debug.keystore"
            fi
          done
          keytool -list -keystore ci/debug.keystore \
            -storepass android -alias androiddebugkey >/dev/null
          echo "LEGACY_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/CampusOne/ci/debug.keystore" >> "$GITHUB_ENV"

      - name: Configure app build properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
        run: |
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.anon.key=$SUPABASE_ANON_KEY"
            echo "google.oauth.client_id=$GOOGLE_OAUTH_CLIENT_ID"
            echo "google.oauth.web_client_id=$GOOGLE_OAUTH_WEB_CLIENT_ID"
            echo "google.oauth.web_client_secret=$GOOGLE_OAUTH_WEB_CLIENT_SECRET"
            echo "google.oauth.callback_url=$GOOGLE_OAUTH_CALLBACK_URL"
          } > local.properties

      - name: Build legacy-signed baseline and rotated release APK
        env:
          CURRENT_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -s "$LEGACY_DEBUG_KEYSTORE"
          PREVIOUS_VERSION_CODE=$((CURRENT_VERSION_CODE - 1))
          if [ "$PREVIOUS_VERSION_CODE" -lt 1 ]; then
            PREVIOUS_VERSION_CODE=1
          fi

          # Reproduce the stable debug-signed APK installed by the earlier CI flow.
          VERSION_CODE="$PREVIOUS_VERSION_CODE" \
          VERSION_NAME="1.0.$PREVIOUS_VERSION_CODE" gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/campusone-legacy-debug.apk"

          # Build the current release with the permanent release key.
          VERSION_CODE="$CURRENT_VERSION_CODE" \
          VERSION_NAME="1.0.$CURRENT_VERSION_CODE" gradle assembleRelease --rerun-tasks
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/campusone-release-pre-rotation.apk"

          # Trust the legacy debug signer for installed-data migration, then move
          # Android 9+ devices to the permanent release signer using APK v3 lineage.
          LINEAGE="$RUNNER_TEMP/campusone-signing-lineage.bin"
          "$APKSIGNER" rotate --out "$LINEAGE" \
            --old-signer \
              --ks "$LEGACY_DEBUG_KEYSTORE" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --set-installed-data true \
              --set-shared-uid false \
              --set-permission false \
              --set-rollback false \
              --set-auth false \
            --new-signer \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD

          # v1/v2/v3 switches are GENERAL apksigner options: set them once,
          # before the per-signer configs. API 26+ supports v2, so v1 is not needed.
          # The oldest lineage signer supplies v2; the rotated signer supplies v3.
          "$APKSIGNER" sign \
            --lineage "$LINEAGE" \
            --rotation-min-sdk-version 28 \
            --min-sdk-version 26 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$LEGACY_DEBUG_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --next-signer \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/campusone-release-rotated.apk" \
            "$RUNNER_TEMP/campusone-release-pre-rotation.apk"

          mv "$RUNNER_TEMP/campusone-release-rotated.apk" \
            app/build/outputs/apk/release/app-release.apk
          test -s "$RUNNER_TEMP/campusone-legacy-debug.apk"
          test -s app/build/outputs/apk/release/app-release.apk
          test -s "$LINEAGE"

      - name: Verify rotated APK metadata, signing lineage, signatures and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$PACKAGE" = "in.campusone.app" || {
            echo "::error::Unexpected APK package: $PACKAGE"
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'35'"
          printf '%s\n' "$BADGING" | grep -Eq "^application:.*label='CampusOne'.*icon='"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::Release APK is marked debuggable."
            exit 1
          fi
          "$ZIPALIGN" -c 4 "$APK"

          # API 26-27 use the legacy signer through v2; API 28+ use the rotated signer through v3.
          LEGACY_SHA1=$(keytool -list -v -keystore "$LEGACY_DEBUG_KEYSTORE" \
            -alias androiddebugkey -storepass android | grep -m1 'SHA1:' | awk -F'SHA1: ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          LEGACY_VERIFY="$RUNNER_TEMP/campusone-legacy-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs \
            --min-sdk-version 26 --max-sdk-version 27 "$APK" | tee "$LEGACY_VERIFY"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$LEGACY_VERIFY"
          grep -Fqi "$LEGACY_SHA1" "$LEGACY_VERIFY" || {
            echo "::error::Legacy signing certificate is not present for API 26-27."
            exit 1
          }

          # Android 9-12 must verify the new release signer via APK Signature Scheme v3.
          RELEASE_VERIFY="$RUNNER_TEMP/campusone-release-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs \
            --min-sdk-version 28 --max-sdk-version 32 "$APK" | tee "$RELEASE_VERIFY"
          # With a v3 signing lineage, Android 9+ verifies the rotated signer via v3.
          # The API 28+ apksigner report may correctly show v2=false for this signer.
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "$RELEASE_VERIFY"

          EXPECTED_SHA1="50341BDAAE1E1CFCC7E26893D3CF8A1F7AFC35A2"
          EXPECTED_SHA256="E28B7893A26DF63884498AEF018575D3875ACEF2C0DC0DB9A06D4EFFA543F273"
          grep -Fqi "$EXPECTED_SHA1" "$RELEASE_VERIFY" || {
            echo "::error::Permanent release certificate SHA-1 is not present in the API 28-32 signature."
            exit 1
          }
          grep -Fqi "$EXPECTED_SHA256" "$RELEASE_VERIFY" || {
            echo "::error::Permanent release certificate SHA-256 is not present in the API 28-32 signature."
            exit 1
          }

          LINEAGE_VERIFY="$("$APKSIGNER" lineage --in "$RUNNER_TEMP/campusone-signing-lineage.bin" --print-certs)"
          printf '%s\n' "$LINEAGE_VERIFY"
          printf '%s\n' "$LINEAGE_VERIFY" | grep -Fqi "$LEGACY_SHA1"
          printf '%s\n' "$LINEAGE_VERIFY" | grep -Fqi "$EXPECTED_SHA1"
          printf '%s\n' "$LINEAGE_VERIFY" | grep -Fq 'Has installed data capability: true' || {
            echo "::error::Signing lineage does not grant installed-data continuity."
            exit 1
          }

          MANIFEST_DUMP="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          FORBIDDEN=(
            "android.permission.READ_SMS"
            "android.permission.RECEIVE_SMS"
            "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
            "android.permission.BIND_ACCESSIBILITY_SERVICE"
            "android.permission.REQUEST_INSTALL_PACKAGES"
            "android.permission.QUERY_ALL_PACKAGES"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for permission in "${FORBIDDEN[@]}"; do
            if printf '%s\n' "$MANIFEST_DUMP" | grep -Fq "$permission"; then
              echo "::error::Forbidden install-sensitive permission found: $permission"
              exit 1
            fi
          done

          echo "PASS: package=$PACKAGE; stable debug-to-release signing lineage; installed-data capability; v2 legacy and v2/v3 rotated signatures; permanent release key; alignment; permission audit."

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusOne-release-apk
          path: CampusOne/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
