name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, phase-3]
defaults:
  run:
    working-directory: CampusOne
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: ./gradlew -Pandroid.useAndroidX=true assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: campusone-debug-apk
          path: CampusOne/app/build/outputs/apk/debug/*.apk
