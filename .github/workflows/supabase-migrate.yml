name: Apply Supabase migrations
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require database credential
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error title=Missing credential::SUPABASE_DB_URL is not configured for this repository. Add the Postgres connection string (Dashboard -> Project Settings -> Database -> Connection string -> URI) as a repository secret, then re-run this workflow."
            exit 1
          fi
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply idempotent migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify profile directory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select (select count(*) from auth.users) as auth_users, (select count(*) from public.profiles) as profiles;"
